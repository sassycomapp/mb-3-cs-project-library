# Fields each role may change, where it differs by role (IN-04, ASVS 8.2.3).
writable_fields:
  bookings:
    Owner: [status, start_datetime, end_datetime, special_requests, meeting_type, provider_id, resource_id]
    Staff: [special_requests]
    Customer: [special_requests]
  invoice:
    Owner: [status, notes, payment_terms_days]
    Manager: [status, notes, payment_terms_days]
  contacts:
    Owner: [first_name, last_name, email, phone, status, tags, internal_notes, preferences]
    Admin: [first_name, last_name, email, phone, status, tags]
  tasks:
    Owner: [task_title, due_date, completed, notes]
    Staff: [completed, notes]
  users:
    Owner: [role, account_status, full_name, phone, permissions, preferences]
  email_messages:
    Owner: [is_read, is_starred, folder]
    Staff: [is_read, is_starred, folder]   # own addresses and desks only
  notifications:
    Owner: [is_read]
    Staff: [is_read]
    Customer: [is_read]
  consents:
    SignedOut: []   # choice written by the server from the request; no client-chosen fields
