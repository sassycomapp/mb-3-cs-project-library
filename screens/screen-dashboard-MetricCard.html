<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — MetricCard Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-body: 14px/20px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
      --elevation-card: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      --elevation-card-hover: 0 4px 12px rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface-variant);
      line-height: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      gap: var(--space-8);
    }

    .demo-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cards-row {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
    }

    /* MetricCard — elevated card for KPI metrics */
    .metric-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--space-6);
      box-shadow: var(--elevation-card);
      transition: box-shadow 0.2s;
      min-width: 200px;
      max-width: 280px;
    }

    .metric-card:hover {
      box-shadow: var(--elevation-card-hover);
    }

    .metric-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-2);
    }

    .metric-value {
      font: var(--font-headline-large);
      color: var(--on-surface);
      margin-bottom: var(--space-1);
    }

    .metric-sublabel {
      font: var(--font-caption);
      color: var(--on-surface-variant);
    }

    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font: var(--font-caption);
      margin-top: var(--space-2);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-input);
    }

    .metric-trend-up {
      color: #1B6D2F;
      background: #D4EDDA;
    }

    .metric-trend-down {
      color: #B3261E;
      background: #F9DEDC;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
      }

      .metric-trend-up {
        color: #A8DAB5;
        background: #1B3A24;
      }

      .metric-trend-down {
        color: #F2B8B5;
        background: #3B1111;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    @media (max-width: 480px) {
      .cards-row {
        flex-direction: column;
        align-items: center;
      }

      .metric-card {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <p class="demo-label">MetricCard — Dashboard KPI Component</p>

  <div class="cards-row">
    <article class="metric-card" aria-label="Revenue metric">
      <div class="metric-label">Revenue This Month</div>
      <div class="metric-value">R 12,450</div>
      <div class="metric-trend metric-trend-up">&#9650; 12% from last month</div>
    </article>

    <article class="metric-card" aria-label="Bookings metric">
      <div class="metric-label">Bookings This Month</div>
      <div class="metric-value">48</div>
      <div class="metric-trend metric-trend-up">&#9650; 8% from last month</div>
    </article>

    <article class="metric-card" aria-label="Contacts metric">
      <div class="metric-label">Total Contacts</div>
      <div class="metric-value">156</div>
      <div class="metric-trend metric-trend-up">&#9650; 3 new this week</div>
    </article>
  </div>
</body>
</html>
