<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — LeadCaptureForm</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa; --surface-container: #efedf5;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --error: #b42336; --on-error: #ffffff;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-6: 24px; --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --state-pressed-opacity: 0.12;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); }
    .lead-form-container { max-width: 480px; width: 100%; }
    .lead-card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 8px; padding: var(--space-8); box-shadow: var(--mui-shadow-card); }
    .lead-title { font-size: 28px; line-height: 36px; font-weight: 600; color: var(--on-surface); margin-bottom: var(--space-2); text-align: center; }
    .lead-subtitle { font-size: 14px; color: var(--on-surface-variant); margin-bottom: var(--space-6); text-align: center; }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: var(--space-1); display: block; }
    .form-input { width: 100%; padding: var(--space-3) var(--space-4); min-height: 48px; font-size: 16px; font-family: var(--font-family); border: 1px solid var(--outline); border-radius: 4px; background: transparent; color: var(--on-surface); transition: border-color 150ms; }
    .form-input:focus { border-color: var(--primary); border-width: 2px; padding: 11px 15px; outline: none; }
    textarea.form-input { min-height: 100px; resize: vertical; }
    .btn { font-family: var(--font-family); font-size: 14px; font-weight: 500; padding: 10px 24px; min-height: 48px; border-radius: 100px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background 150ms, box-shadow 150ms; width: 100%; }
    .btn-filled { background: var(--primary); color: var(--on-primary); }
    .btn-filled:hover { background: rgba(73,62,243,0.92); box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15); }
    .success-message { background: rgba(56,142,60,0.12); color: #155724; border: 1px solid rgba(56,142,60,0.3); border-radius: 8px; padding: var(--space-4); margin-top: var(--space-4); text-align: center; display: none; }
    .success-message .material-icons { font-size: 32px; color: #155724; margin-bottom: var(--space-2); display: block; }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #cfbdf8; --on-primary: #381e72; --primary-container: #4f378b; --on-primary-container: #eaddff; --secondary: #ccc2dc; --on-secondary: #332d41; --secondary-container: #4a4458; --on-secondary-container: #e8def8; --surface: #1c1b20; --on-surface: #e6e1e5; --surface-variant: #49454f; --on-surface-variant: #cac4d0; --surface-container-low: #1d1b20; --outline: #938f99; --outline-variant: #49454f; --error: #f2b8b5; --on-error: #601410; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <div class="lead-form-container">
    <div class="lead-card">
      <h1 class="lead-title">Get Your Free Consultation</h1>
      <p class="lead-subtitle">Fill in your details and we'll get back to you within 24 hours.</p>

      <div class="form-group">
        <label class="form-label" for="txt_name">Your name</label>
        <input class="form-input" type="text" id="txt_name" placeholder="Your name">
      </div>

      <div class="form-group">
        <label class="form-label" for="txt_email">Email address</label>
        <input class="form-input" type="email" id="txt_email" placeholder="Email address">
      </div>

      <div class="form-group">
        <label class="form-label" for="txt_phone">Phone number (optional)</label>
        <input class="form-input" type="tel" id="txt_phone" placeholder="Phone number (optional)">
      </div>

      <div class="form-group">
        <label class="form-label" for="txt_message">Tell us about your needs</label>
        <textarea class="form-input" id="txt_message" placeholder="Tell us about your needs..."></textarea>
      </div>

      <button class="btn btn-filled">Submit</button>

      <!-- SUCCESS MESSAGE (hidden on load) -->
      <div class="success-message">
        <span class="material-icons">check_circle</span>
        Thank you! We'll be in touch soon.
      </div>
    </div>
  </div>

</body>
</html>
