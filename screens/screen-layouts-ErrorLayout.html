<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — ErrorLayout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --error-container: #F9DEDC;
      --on-error-container: #410E0B;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --font-family: 'Roboto', sans-serif;
      --font-display: 57px/64px 400;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-body: 14px/20px 400;
      --font-body-large: 16px/24px 400;
      --font-button: 14px/14px 500;
      --radius-button: 100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }

    .error-container {
      text-align: center;
      max-width: 480px;
    }

    .error-code {
      font: var(--font-display);
      color: var(--primary);
      margin-bottom: var(--space-4);
    }

    .error-heading {
      font: var(--font-headline-large);
      color: var(--on-surface);
      margin-bottom: var(--space-3);
    }

    .error-message {
      font: var(--font-body-large);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-8);
      line-height: 24px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-8);
      font: var(--font-button);
      color: var(--on-primary);
      background: var(--primary);
      border: none;
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 48px;
      text-decoration: none;
    }

    .btn-primary:hover {
      background: #523E8A;
    }

    .btn-primary:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
        --error-container: #8C1D18;
        --on-error-container: #F2B8B5;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="error-container" role="main">
    <div class="error-code">404</div>
    <h1 class="error-heading">Page Not Found</h1>
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="/" class="btn-primary">Go Home</a>
  </main>
</body>
</html>
