<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — CategoryManagementForm-RowTemplate</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-6: 24px;
      --font-family: 'Roboto', sans-serif;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); padding: var(--space-6); }

    /* ===== DATA GRID ROW TEMPLATE ===== */
    .row-template-header { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-3); }
    .data-grid-row { border-bottom: 1px solid var(--divider-color); padding: 12px 16px; display: flex; align-items: center; }
    .data-grid-row:hover { background: rgba(73,62,243, var(--state-hover-opacity)); }
    .data-grid-row > div { padding: 8px; flex: 1; font-size: 14px; }
    .data-grid-row > div:last-child { flex: 0 0 120px; display: flex; gap: var(--space-2); }
    .btn-icon { padding: var(--space-2); min-width: 40px; min-height: 40px; border-radius: 50%; background: transparent; color: var(--on-surface-variant); border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: rgba(73,62,243, var(--state-hover-opacity)); }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #cfbdf8; --on-primary: #381e72; --surface: #1c1b20; --on-surface: #e6e1e5; --surface-variant: #49454f; --on-surface-variant: #cac4d0; --outline: #938f99; --outline-variant: #49454f; }
    }
  </style>
</head>
<body>

  <div class="row-template-header">CategoryManagementForm Row Template</div>

  <div class="data-grid-row">
    <div style="font-weight: 500;">Massage Therapy</div>
    <div style="color: var(--on-surface-variant);">massage-therapy</div>
    <div style="color: var(--on-surface-variant);">Deep tissue, Swedish, hot stone and therapeutic massage treatments</div>
    <div>12</div>
    <div>
      <button class="btn-icon" title="Edit"><span class="material-icons">edit</span></button>
      <button class="btn-icon" title="Delete"><span class="material-icons">delete</span></button>
    </div>
  </div>

</body>
</html>
