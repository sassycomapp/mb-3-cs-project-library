<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Category Row Template</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3; --on-primary: #ffffff;
  --surface: #fdfcff; --on-surface: #1c1b20;
  --on-surface-variant: #494552;
  --outline: #7a7583; --outline-variant: #c9c4d3;
  --error: #b42336;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --font-family: 'Roboto', sans-serif;
  --divider-color: var(--outline-variant);
  --btn-icon-hover: color-mix(in srgb, var(--primary) 8%, transparent);
}

body {
  font-family: var(--font-family); font-size: 14px; line-height: 1.4286;
  color: var(--on-surface); background-color: var(--surface);
  padding: var(--space-4);
}

/* Show 3 sample rows to demonstrate the DataGrid row pattern */
.data-grid {
  border: 1px solid var(--divider-color); border-radius: 24px;
  overflow: hidden; max-width: 900px;
}

.data-grid-header {
  display: flex; gap: var(--space-2); align-items: center;
  background: var(--surface); padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--divider-color);
  font-weight: 500; font-size: 13px; color: var(--on-surface-variant);
}

.data-grid-header > div { flex: 1; }
.data-grid-header > div.shrink { flex: 0 0 auto; min-width: 60px; text-align: center; }
.data-grid-header > div.actions { flex: 0 0 80px; text-align: center; }

.data-grid-row {
  display: flex; gap: var(--space-2); align-items: center;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--divider-color);
}
.data-grid-row:last-child { border-bottom: none; }
.data-grid-row:hover { background: var(--btn-icon-hover); }

.data-grid-row > div { flex: 1; font-size: 14px; color: var(--on-surface); }
.data-grid-row > div.shrink { flex: 0 0 auto; min-width: 60px; text-align: center; color: var(--on-surface-variant); }
.data-grid-row > div.actions { flex: 0 0 80px; display: flex; gap: var(--space-1); justify-content: center; }

.btn-icon {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: var(--on-surface-variant);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: background 150ms;
}
.btn-icon:hover { background: var(--btn-icon-hover); }
.btn-icon .material-icons { font-size: 18px; }

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20; --on-surface: #e6e1e5;
    --on-surface-variant: #cac4d0; --outline: #938f99; --outline-variant: #49454f;
  }
}
</style>
</head>
<body>

<div class="data-grid">
  <div class="data-grid-header">
    <div>Name</div>
    <div>Slug</div>
    <div>Description</div>
    <div class="shrink">Posts</div>
    <div class="actions">Actions</div>
  </div>

  <div class="data-grid-row">
    <div>Business Tips</div>
    <div>business-tips</div>
    <div>Advice and strategies for growing your consulting practice</div>
    <div class="shrink">8</div>
    <div class="actions">
      <button class="btn-icon" title="Edit"><span class="material-icons">edit</span></button>
      <button class="btn-icon" title="Delete"><span class="material-icons">delete</span></button>
    </div>
  </div>

  <div class="data-grid-row">
    <div>Wellness</div>
    <div>wellness</div>
    <div>Health, fitness, and wellness industry insights</div>
    <div class="shrink">5</div>
    <div class="actions">
      <button class="btn-icon" title="Edit"><span class="material-icons">edit</span></button>
      <button class="btn-icon" title="Delete"><span class="material-icons">delete</span></button>
    </div>
  </div>

  <div class="data-grid-row">
    <div>Industry News</div>
    <div>industry-news</div>
    <div>Latest news and trends in the consulting sector</div>
    <div class="shrink">12</div>
    <div class="actions">
      <button class="btn-icon" title="Edit"><span class="material-icons">edit</span></button>
      <button class="btn-icon" title="Delete"><span class="material-icons">delete</span></button>
    </div>
  </div>
</div>

</body>
</html>
