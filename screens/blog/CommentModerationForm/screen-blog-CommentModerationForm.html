<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Comment Moderation</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3; --on-primary: #ffffff;
  --primary-container: #e6dff3; --on-primary-container: #0f0e59;
  --secondary: #625a74; --on-secondary-container: #1e182d;
  --secondary-container: #e8defc;
  --surface: #fdfcff; --on-surface: #1c1b20;
  --surface-variant: #e5e0f0; --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583; --outline-variant: #c9c4d3;
  --error: #b42336;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --mui-shadow-raised: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-outlined-hover: color-mix(in srgb, var(--primary) 8%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
}

body {
  font-family: var(--font-family); font-size: 14px; line-height: 1.4286;
  color: var(--on-surface); background-color: var(--surface);
}

.col-moderation { max-width: 900px; margin: 0 auto; padding: var(--space-6); }

.hdg-moderation-title {
  font-size: 32px; line-height: 40px; font-weight: 600;
  color: var(--on-surface); margin-bottom: var(--space-4);
}

.flow-filters {
  display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;
  margin-bottom: var(--space-4); padding: var(--space-4);
  background: var(--surface-container-low); border-radius: 8px;
}

.form-select {
  min-height: 40px; padding: var(--space-2) var(--space-4);
  font-size: 14px; font-family: var(--font-family);
  border: 1px solid var(--outline); border-radius: 4px;
  background: transparent; color: var(--on-surface);
}

.form-select:focus {
  border-color: var(--primary); border-width: 2px; outline: none;
}

.btn {
  font-family: var(--font-family); font-size: 14px; font-weight: 500;
  padding: 8px 20px; min-height: 36px; border-radius: 100px; border: none;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); transition: background 150ms;
}

.btn-filled { background: var(--primary); color: var(--on-primary); }
.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

.btn-outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn-outlined:hover { background: var(--btn-outlined-hover); }

.card {
  background: var(--surface); border: 1px solid var(--outline-variant);
  border-radius: 8px; padding: var(--space-4);
  box-shadow: var(--mui-shadow-card); margin-bottom: var(--space-4);
  transition: box-shadow 200ms ease;
}

.card:hover { box-shadow: var(--mui-shadow-raised); }

.data-grid {
  border: 1px solid var(--divider-color); border-radius: 24px;
  overflow: hidden;
}

.data-grid-header {
  background: var(--surface-container-low);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--divider-color);
  border-radius: 24px 24px 0 0;
  display: flex; font-weight: 500; font-size: 14px; color: var(--on-surface);
}

.data-grid-header > div { flex: 1; padding: var(--space-2); }

.dg-placeholder {
  padding: var(--space-6); text-align: center;
  color: var(--on-surface-variant); font-size: 13px;
}

.dg-placeholder .material-icons {
  font-size: 24px; vertical-align: middle; opacity: 0.4; margin-right: var(--space-2);
}

.flow-pagination {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-4); margin-top: var(--space-4);
}

.txt-page-info { font-size: 14px; color: var(--on-surface-variant); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<!-- col_moderation (ColumnPanel) -->
<div class="col-moderation">

  <h1 class="hdg-moderation-title">Comment Moderation</h1>

  <!-- flow_filters (FlowPanel) -->
  <div class="flow-filters">
    <select class="form-select">
      <option>All Statuses</option>
      <option>Pending</option>
      <option>Approved</option>
      <option>Rejected</option>
    </select>
    <select class="form-select">
      <option>All Posts</option>
      <option>5 Ways to Grow Your Consulting Business</option>
      <option>Understanding POPIA for Small Businesses</option>
    </select>
  </div>

  <!-- card_comment_list (Card) [outlined] -->
  <div class="card">
    <div class="data-grid">
      <div class="data-grid-header">
        <div>Commenter</div>
        <div>Post</div>
        <div>Preview</div>
        <div>Status</div>
        <div>Date</div>
        <div>Actions</div>
      </div>
      <div class="dg-placeholder">
        <span class="material-icons">table_rows</span>
        dg_comments — row content in CommentModerationForm-RowTemplate screen
      </div>
    </div>
  </div>

  <!-- flow_pagination (FlowPanel) -->
  <div class="flow-pagination">
    <button class="btn btn-outlined">Previous</button>
    <span class="txt-page-info">Page 1 of 3</span>
    <button class="btn btn-outlined">Next</button>
  </div>

  <!-- col_empty_state — hidden on load -->
  <!-- Not rendered: visible = False per wireframe -->

</div>

</body>
</html>
