<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Blog</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3; --on-primary: #ffffff;
  --primary-container: #e6dff3; --on-primary-container: #0f0e59;
  --secondary: #625a74; --on-secondary-container: #1e182d;
  --secondary-container: #e8defc;
  --surface: #fdfcff; --on-surface: #1c1b20;
  --surface-variant: #e5e0f0; --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583; --outline-variant: #c9c4d3;
  --error: #b42336;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --mui-shadow-raised: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-outlined-hover: color-mix(in srgb, var(--primary) 8%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
  --btn-tonal-shadow: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px;
}

body {
  font-family: var(--font-family); font-size: 14px; line-height: 1.4286;
  color: var(--on-surface); background-color: var(--surface);
}

.col-blog-list {
  max-width: 900px; margin: 0 auto; padding: var(--space-6);
}

.hdg-blog-title {
  font-size: 32px; line-height: 40px; font-weight: 600;
  color: var(--on-surface); margin-bottom: var(--space-4);
}

/* Filter bar */
.flow-filters {
  display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;
  margin-bottom: var(--space-6); padding: var(--space-4);
  background: var(--surface-container-low); border-radius: 8px;
}

.form-input, .form-select {
  min-height: 40px; padding: var(--space-2) var(--space-4);
  font-size: 14px; font-family: var(--font-family);
  border: 1px solid var(--outline); border-radius: 4px;
  background: transparent; color: var(--on-surface);
}

.form-input { flex: 1; min-width: 200px; }

.form-input:focus, .form-select:focus {
  border-color: var(--primary); border-width: 2px; padding: 5px 15px; outline: none;
}

.form-input::placeholder { color: var(--on-surface-variant); opacity: 0.7; }

/* Buttons */
.btn {
  font-family: var(--font-family); font-size: 14px; font-weight: 500;
  padding: 8px 20px; min-height: 36px; border-radius: 100px; border: none;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); transition: background 150ms, box-shadow 150ms;
}

.btn-filled { background: var(--primary); color: var(--on-primary); }
.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

.btn-outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.btn-outlined:hover { background: var(--btn-outlined-hover); }

.btn-tonal {
  background: var(--secondary-container); color: var(--on-secondary-container);
}
.btn-tonal:hover { box-shadow: var(--btn-tonal-shadow); }

.btn-icon {
  padding: var(--space-2); min-width: 36px; min-height: 36px;
  border-radius: 50%; background: transparent;
  color: var(--on-surface-variant); border: none;
}

/* View toggle */
.view-toggle {
  display: flex; gap: var(--space-1);
}

/* RepeatingPanel placeholder */
.rp-placeholder {
  border: 1px dashed var(--outline-variant); border-radius: 8px;
  padding: var(--space-8); text-align: center;
  color: var(--on-surface-variant); font-size: 13px;
  margin-bottom: var(--space-4);
}

.rp-placeholder .material-icons {
  font-size: 32px; vertical-align: middle; opacity: 0.4;
  margin-right: var(--space-2);
}

/* Pagination */
.flow-pagination {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-4); margin-top: var(--space-6);
}

.txt-page-info {
  font-size: 14px; color: var(--on-surface-variant);
}

/* Responsive */
@media (max-width: 600px) {
  .flow-filters { flex-direction: column; align-items: stretch; }
  .form-input { min-width: auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<!-- col_blog_list (ColumnPanel) -->
<div class="col-blog-list">

  <!-- hdg_blog_title (Heading) -->
  <h1 class="hdg-blog-title">Our Blog</h1>

  <!-- flow_filters (FlowPanel) -->
  <div class="flow-filters">
    <input type="text" class="form-input" placeholder="Search posts...">
    <select class="form-select">
      <option>All Categories</option>
      <option>Business Tips</option>
      <option>Industry News</option>
      <option>Wellness</option>
    </select>
    <div class="view-toggle">
      <button class="btn btn-tonal">Tiled</button>
      <button class="btn btn-outlined">List</button>
    </div>
  </div>

  <!-- col_tiled_view (ColumnPanel) — visible -->
  <div>
    <!-- rp_blog_tiled (RepeatingPanel) — row content in BlogListTiledTemplate -->
    <div class="rp-placeholder">
      <span class="material-icons">grid_view</span>
      rp_blog_tiled — row content in BlogListTiledTemplate screen
    </div>
  </div>

  <!-- col_list_view (ColumnPanel) — hidden on load -->
  <!-- Not rendered: visible = False per wireframe -->

  <!-- flow_pagination (FlowPanel) -->
  <div class="flow-pagination">
    <button class="btn btn-outlined">Previous</button>
    <span class="txt-page-info">Page 1 of 5</span>
    <button class="btn btn-outlined">Next</button>
  </div>

  <!-- col_empty_state (ColumnPanel) — hidden on load -->
  <!-- Not rendered: visible = False per wireframe -->

</div>

</body>
</html>
