<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Blog Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3;
  --on-primary: #ffffff;
  --primary-container: #e6dff3;
  --on-primary-container: #0f0e59;
  --secondary: #625a74;
  --on-secondary: #ffffff;
  --secondary-container: #e8defc;
  --on-secondary-container: #1e182d;
  --surface: #fdfcff;
  --on-surface: #1c1b20;
  --surface-variant: #e5e0f0;
  --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583;
  --outline-variant: #c9c4d3;
  --error: #b42336;
  --on-error: #ffffff;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --mui-shadow-raised: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-outlined-hover: color-mix(in srgb, var(--primary) 8%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
}

body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.4286;
  color: var(--on-surface);
  background-color: var(--surface);
}

/* col_editor — outermost container */
.col-editor {
  max-width: 900px;
  margin: 0 auto;
  padding: var(--space-6);
  background: var(--surface);
}

/* Page title */
.hdg-editor-title {
  font-size: 32px; line-height: 40px; font-weight: 600;
  color: var(--on-surface); margin-bottom: var(--space-4);
}

/* Action bar */
.flow-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
}

/* Buttons */
.btn {
  font-family: var(--font-family); font-size: 14px; font-weight: 500;
  padding: 10px 24px; min-height: 40px; border-radius: 100px; border: none;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); transition: background 150ms, box-shadow 150ms;
}

.btn-filled { background: var(--primary); color: var(--on-primary); }
.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

.btn-outlined {
  background: transparent; color: var(--primary);
  border: 1px solid var(--outline);
}
.btn-outlined:hover { background: var(--btn-outlined-hover); }

.btn-text {
  background: transparent; color: var(--primary); border: none;
}
.btn-text:hover { background: var(--btn-outlined-hover); }

/* Success message — hidden on load */
.txt-success-message {
  font-size: 14px; color: #2E7D32; background: #DEFCD3;
  padding: var(--space-3) var(--space-4); border-radius: 4px;
  margin-bottom: var(--space-4); display: none;
}

/* Two-column layout */
.editor-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: var(--space-4);
  align-items: start;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 8px;
  padding: var(--space-4);
  box-shadow: var(--mui-shadow-card);
  transition: box-shadow 200ms ease;
}

.card:hover {
  box-shadow: var(--mui-shadow-raised);
}

/* Section titles in sidebar */
.section-title {
  font-size: 14px; font-weight: 500; color: var(--on-surface);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--divider-color);
  opacity: 0.4;
}

.section-title:not(:first-child) {
  margin-top: var(--space-4);
}

/* Form groups */
.form-group { margin-bottom: var(--space-4); }

.form-label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--on-surface); margin-bottom: var(--space-2);
}

.form-input,
.form-textarea,
.form-select {
  width: 100%; min-height: 48px; padding: var(--space-2) var(--space-4);
  font-size: 16px; font-family: var(--font-family);
  border: 1px solid var(--outline); border-radius: 4px;
  background: transparent; color: var(--on-surface);
}

.form-textarea {
  min-height: 100px; resize: vertical;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
  border-color: var(--primary); border-width: 2px; padding: 7px 15px; outline: none;
}

.form-input::placeholder,
.form-textarea::placeholder { color: var(--on-surface-variant); opacity: 0.7; }

/* File loader */
.file-loader {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border: 1px dashed var(--outline); border-radius: 4px;
  cursor: pointer; color: var(--on-surface-variant); font-size: 14px;
}

.file-loader:hover { border-color: var(--primary); color: var(--primary); }

/* Responsive */
@media (max-width: 768px) {
  .editor-layout { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<!-- col_editor (ColumnPanel) — outermost container -->
<div class="col-editor">

  <!-- hdg_editor_title (Heading) -->
  <h1 class="hdg-editor-title">Blog Editor</h1>

  <!-- flow_actions (FlowPanel) -->
  <div class="flow-actions">
    <button class="btn btn-outlined">Save Draft</button>
    <button class="btn btn-filled">Publish</button>
    <button class="btn btn-text">Cancel</button>
  </div>

  <!-- txt_success_message (Text) — hidden on load -->
  <div class="txt-success-message">Post saved successfully.</div>

  <!-- Two-column layout -->
  <div class="editor-layout">

    <!-- Main content column -->
    <div>
      <!-- card_content (Card) [outlined] -->
      <div class="card">

        <!-- txt_title (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_title">Post Title</label>
          <input type="text" id="txt_title" class="form-input" placeholder="Enter post title">
        </div>

        <!-- txt_slug (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_slug">URL Slug</label>
          <input type="text" id="txt_slug" class="form-input" placeholder="post-url-slug">
        </div>

        <!-- txt_excerpt (TextArea) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_excerpt">Excerpt</label>
          <textarea id="txt_excerpt" class="form-textarea" placeholder="Brief summary of the post" rows="3"></textarea>
        </div>

        <!-- txt_content (TextArea) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_content">Content</label>
          <textarea id="txt_content" class="form-textarea" placeholder="Write your blog post content here..." rows="8"></textarea>
        </div>

        <!-- fu_featured_image (FileLoader) -->
        <div class="form-group">
          <div class="file-loader">
            <span class="material-icons" style="font-size:20px;">cloud_upload</span>
            Upload Featured Image
          </div>
        </div>

      </div>
    </div>

    <!-- Sidebar column -->
    <div>
      <!-- card_sidebar (Card) [outlined] -->
      <div class="card">

        <!-- Publishing section -->
        <div class="section-title">Publishing</div>

        <!-- dd_status (DropdownMenu) (W) -->
        <div class="form-group">
          <label class="form-label" for="dd_status">Status</label>
          <select id="dd_status" class="form-select">
            <option>Draft</option>
            <option>Published</option>
            <option>Scheduled</option>
          </select>
        </div>

        <!-- dd_category (DropdownMenu) (W) -->
        <div class="form-group">
          <label class="form-label" for="dd_category">Category</label>
          <select id="dd_category" class="form-select">
            <option>Select category...</option>
            <option>Business Tips</option>
            <option>Industry News</option>
            <option>Wellness</option>
          </select>
        </div>

        <!-- dd_template (DropdownMenu) (W) -->
        <div class="form-group">
          <label class="form-label" for="dd_template">Post Template</label>
          <select id="dd_template" class="form-select">
            <option>Classic Centered</option>
            <option>Two-Column with Sidebar</option>
            <option>Full-Width Immersive</option>
          </select>
        </div>

        <!-- SEO Settings section -->
        <div class="section-title">SEO Settings</div>

        <!-- txt_meta_title (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_meta_title">SEO Title</label>
          <input type="text" id="txt_meta_title" class="form-input" placeholder="SEO title">
        </div>

        <!-- txt_meta_description (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_meta_description">SEO Description</label>
          <input type="text" id="txt_meta_description" class="form-input" placeholder="SEO description">
        </div>

        <!-- txt_keywords (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_keywords">Keywords</label>
          <input type="text" id="txt_keywords" class="form-input" placeholder="keyword1, keyword2">
        </div>

        <!-- Template Options section -->
        <div class="section-title">Template Options</div>

        <!-- txt_pullquote (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_pullquote">Pullquote</label>
          <input type="text" id="txt_pullquote" class="form-input" placeholder="Featured quote">
        </div>

        <!-- txt_video_url (TextBox) (W) -->
        <div class="form-group">
          <label class="form-label" for="txt_video_url">Video URL (YouTube)</label>
          <input type="text" id="txt_video_url" class="form-input" placeholder="https://youtube.com/...">
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
