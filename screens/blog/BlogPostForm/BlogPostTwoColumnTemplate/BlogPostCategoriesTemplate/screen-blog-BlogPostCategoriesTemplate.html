<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Blog Categories Template</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3; --on-primary: #ffffff;
  --surface: #fdfcff; --on-surface: #1c1b20;
  --on-surface-variant: #494552;
  --outline: #7a7583; --outline-variant: #c9c4d3;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --font-family: 'Roboto', sans-serif;
  --divider-color: var(--outline-variant);
}

body {
  font-family: var(--font-family); font-size: 14px; line-height: 1.4286;
  color: var(--on-surface); background-color: var(--surface);
  padding: var(--space-4);
  max-width: 300px;
}

.category-list { list-style: none; }

.category-item {
  display: flex; align-items: baseline; gap: var(--space-2);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--divider-color);
  opacity: 0.4;
}
.category-item:last-child { border-bottom: none; }
.category-item:hover { opacity: 1; }

.nav-category-name {
  font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 500;
}
.nav-category-name:hover { text-decoration: underline; }

.txt-post-count {
  font-size: 12px; color: var(--outline);
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20; --on-surface: #e6e1e5; --outline: #938f99;
    --outline-variant: #49454f;
  }
}
</style>
</head>
<body>

<!-- Sample rows showing the category list pattern -->
<ul class="category-list">
  <li class="category-item">
    <a href="#" class="nav-category-name">Business Tips</a>
    <span class="txt-post-count">(8)</span>
  </li>
  <li class="category-item">
    <a href="#" class="nav-category-name">Wellness</a>
    <span class="txt-post-count">(5)</span>
  </li>
  <li class="category-item">
    <a href="#" class="nav-category-name">Industry News</a>
    <span class="txt-post-count">(12)</span>
  </li>
  <li class="category-item">
    <a href="#" class="nav-category-name">Client Stories</a>
    <span class="txt-post-count">(3)</span>
  </li>
</ul>

</body>
</html>
