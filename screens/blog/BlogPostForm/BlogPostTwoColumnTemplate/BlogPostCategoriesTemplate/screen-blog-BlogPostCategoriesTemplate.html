<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — BlogPostCategoriesTemplate</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MYBIZZ CS — BlogPostCategoriesTemplate Screen
   Design System: Material 3 with MUI Aesthetic Overlay
   Default Palette: Professional Blue
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ===== M3 TOKEN BLOCK — Professional Blue Palette ===== */
:root {
  --primary: #493ef3;
  --on-primary: #ffffff;
  --primary-container: #e6dff3;
  --on-primary-container: #0f0e59;
  --secondary: #625a74;
  --on-secondary: #ffffff;
  --secondary-container: #e8defc;
  --on-secondary-container: #1e182d;
  --surface: #fdfcff;
  --on-surface: #1c1b20;
  --surface-variant: #e5e0f0;
  --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583;
  --outline-variant: #c9c4d3;
  --font-family: 'Roboto', sans-serif;
  /* MUI Aesthetic Overlay Variables */
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --divider-color: var(--outline-variant);
  --state-hover-opacity: 0.08;
}

body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.4286;
  color: var(--on-surface);
  background-color: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px;
}

/* ===== SCREEN CONTAINER ===== */
.screen-container {
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 8px;
  padding: 16px;
  box-shadow: var(--mui-shadow-card);
}

.screen-label {
  font-size: 10px;
  color: var(--outline);
  margin-bottom: 12px;
  font-style: italic;
}

/* ===== CATEGORY ITEM (flow_category_item) ===== */
.flow-category-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--divider-color);
  opacity: 0.4;
}

.flow-category-item:last-child {
  border-bottom: none;
}

/* nav_category_name (Link) */
.nav-category-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--on-surface-variant);
  text-decoration: none;
  flex: 1;
  transition: color 150ms;
}

.nav-category-name:hover {
  color: var(--primary);
}

/* txt_post_count (Text) */
.txt-post-count {
  font-size: 14px;
  color: var(--outline);
  flex-shrink: 0;
}

/* ===== COMPONENT ANNOTATIONS ===== */
.component-label {
  font-size: 10px;
  color: var(--outline);
  margin-top: 4px;
  font-style: italic;
}
</style>
</head>
<body>

<div class="screen-container">
  <div class="screen-label">BlogPostCategoriesTemplate — row template for rp_categories</div>

  <!-- flow_category_item (FlowPanel) -->
  <div class="flow-category-item">
    <a href="#" class="nav-category-name">Business Strategy</a>
    <span class="txt-post-count">(12)</span>
  </div>
  <div class="component-label">flow_category_item (FlowPanel) — nav_category_name (Link) + txt_post_count (Text)</div>
</div>

</body>
</html>
