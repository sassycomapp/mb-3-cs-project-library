<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Blog Related Posts Template</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3; --on-primary: #ffffff;
  --surface: #fdfcff; --on-surface: #1c1b20;
  --on-surface-variant: #494552;
  --outline: #7a7583; --outline-variant: #c9c4d3;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --font-family: 'Roboto', sans-serif;
  --divider-color: var(--outline-variant);
}

body {
  font-family: var(--font-family); font-size: 14px; line-height: 1.4286;
  color: var(--on-surface); background-color: var(--surface);
  padding: var(--space-4);
  max-width: 300px;
}

.related-post-item {
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--divider-color);
}
.related-post-item:last-child { border-bottom: none; }

.nav-post-title {
  display: block; font-size: 14px; font-weight: 500;
  color: var(--primary); text-decoration: none; margin-bottom: 2px;
  line-height: 1.4;
}
.nav-post-title:hover { text-decoration: underline; }

.txt-meta { font-size: 12px; color: var(--outline); }

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20; --on-surface: #e6e1e5; --outline: #938f99;
    --outline-variant: #49454f;
  }
}
</style>
</head>
<body>

<!-- Sample rows showing the related posts pattern -->
<div>
  <div class="related-post-item">
    <a href="#" class="nav-post-title">Understanding POPIA for Small Businesses</a>
    <span class="txt-meta">10 Jun 2026 · 890 views</span>
  </div>
  <div class="related-post-item">
    <a href="#" class="nav-post-title">How AI Is Transforming Client Management</a>
    <span class="txt-meta">5 Jun 2026 · 2 100 views</span>
  </div>
  <div class="related-post-item">
    <a href="#" class="nav-post-title">Building Trust with Your First 10 Clients</a>
    <span class="txt-meta">28 May 2026 · 650 views</span>
  </div>
</div>

</body>
</html>
