<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — ErrorLayout</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* M3 Token Block — Professional Blue Palette */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3;
      --on-primary: #ffffff;
      --primary-container: #e6dff3;
      --on-primary-container: #0f0e59;
      --secondary: #625a74;
      --on-secondary: #ffffff;
      --secondary-container: #e8defc;
      --on-secondary-container: #1e182d;
      --surface: #fdfcff;
      --on-surface: #1c1b20;
      --surface-variant: #e5e0f0;
      --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa;
      --surface-container: #efedf5;
      --surface-container-high: #eae7ef;
      --outline: #7a7583;
      --outline-variant: #c9c4d3;
      --error: #b42336;
      --on-error: #ffffff;
      --error-container: #f4dddc;
      --on-error-container: #410004;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      /* MUI Aesthetic Overlay Variables */
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --mui-shadow-raised: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --state-pressed-opacity: 0.12;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    /* ===== ERROR CONTAINER ===== */
    .error-container {
      max-width: 480px;
      text-align: center;
      padding: var(--space-8) var(--space-6);
    }
    .error-code {
      font-size: 57px;
      line-height: 64px;
      font-weight: 400;
      color: var(--primary);
      margin-bottom: var(--space-4);
    }
    .error-title {
      font-size: 32px;
      line-height: 40px;
      font-weight: 600;
      color: var(--on-surface);
      margin-bottom: var(--space-3);
    }
    .error-message {
      font-size: 16px;
      line-height: 24px;
      color: var(--on-surface-variant);
      margin-bottom: var(--space-8);
    }

    /* ===== BUTTON ===== */
    .btn { font-family: var(--font-family); font-size: 14px; font-weight: 500; padding: 10px 24px; min-height: 40px; border-radius: 100px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background 150ms, box-shadow 150ms; }
    .btn-filled { background: var(--primary); color: var(--on-primary); }
    .btn-filled:hover { background: rgba(73,62,243,0.92); box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .error-container { padding: var(--space-6) var(--space-4); }
      .error-code { font-size: 40px; line-height: 48px; }
      .error-title { font-size: 24px; line-height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
    <button class="btn btn-filled"><span class="material-icons">home</span> Go Home</button>
  </div>

</body>
</html>
