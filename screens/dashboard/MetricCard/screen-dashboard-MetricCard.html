<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — MetricCard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --error: #b42336; --on-error: #ffffff;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-6: 24px; --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --state-pressed-opacity: 0.12;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-8); }

    .demo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); max-width: 900px; width: 100%; }
    .demo-label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-2); grid-column: 1 / -1; }

    .metric-card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: 8px; padding: var(--space-6); box-shadow: var(--mui-shadow-card); cursor: default; transition: box-shadow 200ms ease; }
    .metric-card:hover { box-shadow: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px; }
    .metric-card .material-icons { font-size: 20px; color: var(--on-surface-variant); margin-bottom: var(--space-2); display: block; }
    .metric-label { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-1); }
    .metric-value { font-size: 28px; line-height: 36px; font-weight: 600; color: var(--on-surface); }
    .metric-trend { font-size: 13px; font-weight: 500; margin-top: var(--space-1); display: flex; align-items: center; gap: var(--space-1); }
    .metric-trend.positive { color: #155724; }
    .metric-trend.negative { color: var(--error); }
    .metric-trend .material-icons { font-size: 14px; margin: 0; }

    @media (prefers-color-scheme: dark) {
      :root { --primary: #cfbdf8; --on-primary: #381e72; --primary-container: #4f378b; --on-primary-container: #eaddff; --secondary: #ccc2dc; --on-secondary: #332d41; --secondary-container: #4a4458; --on-secondary-container: #e8def8; --surface: #1c1b20; --on-surface: #e6e1e5; --surface-variant: #49454f; --on-surface-variant: #cac4d0; --surface-container-low: #1d1b20; --outline: #938f99; --outline-variant: #49454f; --error: #f2b8b5; --on-error: #601410; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media (max-width: 600px) { .demo-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div class="demo-grid">

    <div class="demo-label">MetricCard Component — 4 Variants</div>

    <!-- REVENUE -->
    <div class="metric-card">
      <span class="material-icons">payments</span>
      <div class="metric-label">Revenue (This Month)</div>
      <div class="metric-value">R 48,750</div>
      <div class="metric-trend positive"><span class="material-icons">trending_up</span> +12.5%</div>
    </div>

    <!-- BOOKINGS -->
    <div class="metric-card">
      <span class="material-icons">event</span>
      <div class="metric-label">Bookings (This Month)</div>
      <div class="metric-value">127</div>
      <div class="metric-trend positive"><span class="material-icons">trending_up</span> +8.3%</div>
    </div>

    <!-- CUSTOMERS -->
    <div class="metric-card">
      <span class="material-icons">people</span>
      <div class="metric-label">Customers (This Month)</div>
      <div class="metric-value">34</div>
      <div class="metric-trend positive"><span class="material-icons">trending_up</span> +15.2%</div>
    </div>

    <!-- AVG ORDER VALUE -->
    <div class="metric-card">
      <span class="material-icons">receipt</span>
      <div class="metric-label">Avg Order Value</div>
      <div class="metric-value">R 384</div>
      <div class="metric-trend negative"><span class="material-icons">trending_down</span> -2.1%</div>
    </div>

  </div>

</body>
</html>
