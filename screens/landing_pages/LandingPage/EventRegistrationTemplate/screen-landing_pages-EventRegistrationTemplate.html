<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — EventRegistrationTemplate</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* M3 Token Block — Professional Blue Palette */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3;
      --on-primary: #ffffff;
      --primary-container: #e6dff3;
      --on-primary-container: #0f0e59;
      --secondary: #625a74;
      --on-secondary: #ffffff;
      --secondary-container: #e8defc;
      --on-secondary-container: #1e182d;
      --surface: #fdfcff;
      --on-surface: #1c1b20;
      --surface-variant: #e5e0f0;
      --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa;
      --surface-container: #efedf5;
      --surface-container-high: #eae7ef;
      --outline: #7a7583;
      --outline-variant: #c9c4d3;
      --error: #b42336;
      --on-error: #ffffff;
      --error-container: #f4dddc;
      --on-error-container: #410004;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      /* MUI Aesthetic Overlay Variables */
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --mui-shadow-raised: hsla(220,30%,5%,0.10) 0px 6px 20px 0px, hsla(220,25%,10%,0.10) 0px 10px 20px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --state-pressed-opacity: 0.12;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); }

    /* ===== COMPONENT CONTAINER ===== */
    .component-container {
      width: 100%;
      max-width: 500px;
    }

    /* ===== FORM CARD ===== */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--divider-color);
      border-radius: 8px;
      padding: var(--space-6);
      box-shadow: var(--mui-shadow-card);
    }
    .form-title { font-size: 22px; line-height: 28px; font-weight: 600; color: var(--on-surface); margin-bottom: var(--space-4); text-align: center; }

    /* ===== FORM FIELDS ===== */
    .form-group { margin-bottom: var(--space-4); }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--on-surface-variant); margin-bottom: var(--space-2); }
    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      min-height: 48px;
      font-size: 16px;
      font-family: var(--font-family);
      border: 1px solid var(--outline);
      border-radius: 4px;
      background: transparent;
      color: var(--on-surface);
      transition: border-color 150ms;
    }
    .form-input:focus { border-color: var(--primary); border-width: 2px; outline: none; }
    .form-input::placeholder { color: var(--on-surface-variant); }
    .form-select {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      min-height: 48px;
      font-size: 16px;
      font-family: var(--font-family);
      border: 1px solid var(--outline);
      border-radius: 4px;
      background: transparent;
      color: var(--on-surface);
      cursor: pointer;
    }
    .form-select:focus { border-color: var(--primary); outline: none; }

    /* ===== BUTTONS ===== */
    .btn { font-family: var(--font-family); font-size: 14px; font-weight: 500; padding: 10px 24px; min-height: 40px; border-radius: 100px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background 150ms, box-shadow 150ms; }
    .btn-filled { background: var(--primary); color: var(--on-primary); }
    .btn-filled:hover { background: rgba(73,62,243,0.92); box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15); }
    .btn-full { width: 100%; }

    /* ===== SUCCESS MESSAGE ===== */
    .success-message {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: var(--space-4);
      text-align: center;
      margin-top: var(--space-4);
      display: none;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { padding: var(--space-4); }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <div class="component-container">
    <div class="form-card">
      <h2 class="form-title">Register for this event</h2>
      <div class="form-group">
        <label class="form-label">Your name</label>
        <input class="form-input" type="text" placeholder="Your name">
      </div>
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input class="form-input" type="email" placeholder="Email address">
      </div>
      <div class="form-group">
        <label class="form-label">Select Event</label>
        <select class="form-select">
          <option value="" disabled selected>Choose an event...</option>
          <option>Summer Wellness Workshop — 15 Jul 2026</option>
          <option>Business Growth Masterclass — 22 Jul 2026</option>
          <option>Mindfulness Retreat — 05 Aug 2026</option>
        </select>
      </div>
      <button class="btn btn-filled btn-full">Register Now</button>

      <!-- SUCCESS MESSAGE (hidden) -->
      <div class="success-message">
        You're registered! Check your email for confirmation details.
      </div>
    </div>
  </div>

</body>
</html>
