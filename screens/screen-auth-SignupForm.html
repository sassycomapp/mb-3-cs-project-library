<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-display: 57px/64px 400;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-body: 14px/20px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
      --elevation-card: 2dp;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .signup-container {
      width: 100%;
      max-width: 400px;
      padding: var(--space-8);
    }

    .signup-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--space-8);
      box-shadow: 0 var(--elevation-card);
    }

    .signup-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .signup-header h1 {
      font: var(--font-headline-large);
      color: var(--on-surface);
      margin-bottom: var(--space-2);
    }

    .signup-header p {
      font: var(--font-body);
      color: var(--on-surface-variant);
    }

    .form-group {
      margin-bottom: var(--space-4);
    }

    .form-label {
      display: block;
      font: var(--font-label);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-2);
    }

    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-input);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-container);
    }

    .form-input::placeholder {
      color: var(--outline);
    }

    .form-checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }

    .form-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .form-checkbox-label {
      font: var(--font-body);
      color: var(--on-surface-variant);
      cursor: pointer;
      line-height: 20px;
    }

    .form-checkbox-label a {
      color: var(--primary);
      text-decoration: none;
    }

    .form-checkbox-label a:hover {
      text-decoration: underline;
    }

    .form-checkbox-label a:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .form-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-top: var(--space-6);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      font: var(--font-button);
      color: var(--on-primary);
      background: var(--primary);
      border: none;
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
    }

    .btn-primary:hover {
      background: #523E8A;
    }

    .btn-primary:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .form-footer {
      text-align: center;
      margin-top: var(--space-6);
      font: var(--font-caption);
      color: var(--on-surface-variant);
    }

    .form-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    .form-footer a:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="signup-container" role="main">
    <article class="signup-card">
      <header class="signup-header">
        <h1>Create Account</h1>
        <p>Start managing your business with Mybizz</p>
      </header>

      <form id="signupForm" action="/auth/signup" method="POST">
        <div class="form-group">
          <label for="business_name" class="form-label">Business name</label>
          <input
            type="text"
            id="business_name"
            name="business_name"
            class="form-input"
            placeholder="Enter your business name"
            autocomplete="organization"
            required
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-input"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-checkbox-group">
          <input
            type="checkbox"
            id="agree_terms"
            name="agree_terms"
            class="form-checkbox"
            required
          >
          <label for="agree_terms" class="form-checkbox-label">I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">
            Create Account
          </button>
        </div>

        <div class="form-footer">
          Already have an account? <a href="/auth/login">Sign in</a>
        </div>
      </form>
    </article>
  </main>
</body>
</html>
