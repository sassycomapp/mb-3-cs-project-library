<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3;
  --on-primary: #ffffff;
  --primary-container: #e6dff3;
  --on-primary-container: #0f0e59;
  --secondary: #625a74;
  --on-secondary: #ffffff;
  --secondary-container: #e8defc;
  --on-secondary-container: #1e182d;
  --surface: #fdfcff;
  --on-surface: #1c1b20;
  --surface-variant: #e5e0f0;
  --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583;
  --outline-variant: #c9c4d3;
  --error: #b42336;
  --on-error: #ffffff;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
}

body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.4286;
  color: var(--on-surface);
  background-color: var(--surface);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}

.auth-container {
  width: 100%;
  max-width: 400px;
}

.card-signup {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 8px;
  padding: var(--space-6);
  box-shadow: var(--mui-shadow-card);
  width: 100%;
}

.hdg-signup-title {
  font-size: 32px;
  line-height: 40px;
  font-weight: 600;
  color: var(--on-surface);
  margin-bottom: var(--space-1);
  text-align: center;
}

.txt-signup-subtitle {
  font-size: 14px;
  line-height: 20px;
  color: var(--on-surface-variant);
  text-align: center;
  margin-bottom: var(--space-6);
}

.txt-signup-error {
  font-size: 14px;
  line-height: 20px;
  color: var(--error);
  background: #f4dddc;
  padding: var(--space-3) var(--space-4);
  border-radius: 4px;
  margin-bottom: var(--space-4);
  display: none;
}

.form-group {
  margin-bottom: var(--space-4);
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--on-surface);
  margin-bottom: var(--space-2);
}

.form-input {
  width: 100%;
  min-height: 48px;
  padding: var(--space-2) var(--space-4);
  font-size: 16px;
  font-family: var(--font-family);
  border: 1px solid var(--outline);
  border-radius: 4px;
  background: transparent;
  color: var(--on-surface);
}

.form-input:focus {
  border-color: var(--primary);
  border-width: 2px;
  padding: 7px 15px;
  outline: none;
}

.form-input::placeholder {
  color: var(--on-surface-variant);
  opacity: 0.7;
}

.terms-text {
  font-size: 12px;
  color: var(--on-surface-variant);
  text-align: center;
  margin-bottom: var(--space-4);
  line-height: 1.6;
}

.terms-text a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}

.terms-text a:hover {
  text-decoration: underline;
}

.btn {
  font-family: var(--font-family);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 24px;
  min-height: 40px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 150ms, box-shadow 150ms;
  width: 100%;
}

.btn-filled {
  background: var(--primary);
  color: var(--on-primary);
}

.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

.link {
  font-size: 14px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}

.link:hover {
  opacity: 0.8;
  text-decoration: underline;
}

.login-prompt {
  text-align: center;
  margin-top: var(--space-4);
  font-size: 14px;
  color: var(--on-surface-variant);
}

.login-prompt .link {
  margin-left: var(--space-1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<div class="auth-container">

  <!-- card_signup (Card) — outlined -->
  <div class="card-signup">

    <!-- hdg_signup_title (Heading) -->
    <h1 class="hdg-signup-title">Create your account</h1>

    <!-- txt_signup_subtitle (Text) -->
    <p class="txt-signup-subtitle">Set up your business in minutes</p>

    <!-- txt_signup_error (Text) — hidden on load -->
    <div class="txt-signup-error">
      An error occurred. Please try again.
    </div>

    <!-- txt_full_name (TextBox) — (W) outlined -->
    <div class="form-group">
      <label class="form-label" for="txt_full_name">Full name</label>
      <input type="text" id="txt_full_name" class="form-input" placeholder="Full name">
    </div>

    <!-- txt_email (TextBox) — (W) outlined -->
    <div class="form-group">
      <label class="form-label" for="txt_email">Email address</label>
      <input type="email" id="txt_email" class="form-input" placeholder="Email address">
    </div>

    <!-- txt_password (TextBox) — (W) outlined hide_text -->
    <div class="form-group">
      <label class="form-label" for="txt_password">Password</label>
      <input type="password" id="txt_password" class="form-input" placeholder="Password">
    </div>

    <!-- txt_confirm_password (TextBox) — (W) outlined hide_text -->
    <div class="form-group">
      <label class="form-label" for="txt_confirm_password">Confirm password</label>
      <input type="password" id="txt_confirm_password" class="form-input" placeholder="Confirm password">
    </div>

    <!-- txt_terms_prompt + nav_terms + txt_and + nav_privacy -->
    <div class="terms-text">
      By creating an account you agree to our
      <a href="#">Terms of Service</a>
      and
      <a href="#">Privacy Policy</a>
    </div>

    <!-- btn_signup (Button) — filled -->
    <button class="btn btn-filled">Create Account</button>

  </div>

  <!-- txt_login_prompt (Text) + nav_login (Link) -->
  <div class="login-prompt">
    Already have an account?
    <a href="#" class="link">Log in</a>
  </div>

</div>

</body>
</html>
