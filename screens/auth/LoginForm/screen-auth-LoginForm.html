<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Log In</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MYBIZZ CS — LoginForm Screen
   Design System: Material 3 with MUI Aesthetic Overlay
   Palette: Professional Blue
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3;
  --on-primary: #ffffff;
  --primary-container: #e6dff3;
  --on-primary-container: #0f0e59;
  --secondary: #625a74;
  --on-secondary: #ffffff;
  --secondary-container: #e8defc;
  --on-secondary-container: #1e182d;
  --surface: #fdfcff;
  --on-surface: #1c1b20;
  --surface-variant: #e5e0f0;
  --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --surface-container: #efedf5;
  --outline: #7a7583;
  --outline-variant: #c9c4d3;
  --error: #b42336;
  --on-error: #ffffff;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
}

body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.4286;
  color: var(--on-surface);
  background-color: var(--surface);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}

/* Auth container — 400px centred */
.auth-container {
  width: 100%;
  max-width: 400px;
}

/* card_login (Card) — outlined */
.card-login {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 8px; /* MUI: card radius 8px */
  padding: var(--space-6);
  box-shadow: var(--mui-shadow-card);
  width: 100%;
}

/* hdg_login_title */
.hdg-login-title {
  font-size: 32px;
  line-height: 40px;
  font-weight: 600; /* MUI: heading weight 600 */
  color: var(--on-surface);
  margin-bottom: var(--space-1);
  text-align: center;
}

/* txt_login_subtitle */
.txt-login-subtitle {
  font-size: 14px;
  line-height: 20px;
  color: var(--on-surface-variant);
  text-align: center;
  margin-bottom: var(--space-6);
}

/* txt_login_error — hidden on load */
.txt-login-error {
  font-size: 14px;
  line-height: 20px;
  color: var(--error);
  background: var(--error-container, #f4dddc);
  padding: var(--space-3) var(--space-4);
  border-radius: 4px;
  margin-bottom: var(--space-4);
  display: none; /* hidden on load */
}

/* Form groups */
.form-group {
  margin-bottom: var(--space-4);
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--on-surface);
  margin-bottom: var(--space-2);
}

.form-input {
  width: 100%;
  min-height: 48px;
  padding: var(--space-2) var(--space-4);
  font-size: 16px;
  font-family: var(--font-family);
  border: 1px solid var(--outline);
  border-radius: 4px;
  background: transparent;
  color: var(--on-surface);
}

.form-input:focus {
  border-color: var(--primary);
  border-width: 2px;
  padding: 7px 15px;
  outline: none;
}

.form-input::placeholder {
  color: var(--on-surface-variant);
  opacity: 0.7;
}

/* Checkbox */
.checkbox-group {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.checkbox-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
}

.checkbox-group label {
  font-size: 14px;
  color: var(--on-surface);
  cursor: pointer;
}

/* Buttons */
.btn {
  font-family: var(--font-family);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 24px;
  min-height: 40px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  transition: background 150ms, box-shadow 150ms;
  width: 100%;
}

.btn-filled {
  background: var(--primary);
  color: var(--on-primary);
}

.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

/* Links */
.link {
  font-size: 14px;
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
  transition: opacity 150ms;
}

.link:hover {
  opacity: 0.8;
  text-decoration: underline;
}

/* Forgot password — centred below button */
.forgot-password {
  text-align: center;
  margin-top: var(--space-3);
}

/* Sign up prompt — below card */
.signup-prompt {
  text-align: center;
  margin-top: var(--space-4);
  font-size: 14px;
  color: var(--on-surface-variant);
}

.signup-prompt .link {
  margin-left: var(--space-1);
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<!-- Auth container — 400px centred -->
<div class="auth-container">

  <!-- card_login (Card) — outlined -->
  <div class="card-login">

    <!-- hdg_login_title (Heading) -->
    <h1 class="hdg-login-title">Log in to your account</h1>

    <!-- txt_login_subtitle (Text) -->
    <p class="txt-login-subtitle">Enter your email and password to continue</p>

    <!-- txt_login_error (Text) — hidden on load -->
    <div class="txt-login-error">
      Invalid email or password. Please try again.
    </div>

    <!-- txt_email (TextBox) — (W) appearance="outlined" -->
    <div class="form-group">
      <label class="form-label" for="txt_email">Email address</label>
      <input type="email" id="txt_email" class="form-input" placeholder="Email address">
    </div>

    <!-- txt_password (TextBox) — (W) appearance="outlined" hide_text -->
    <div class="form-group">
      <label class="form-label" for="txt_password">Password</label>
      <input type="password" id="txt_password" class="form-input" placeholder="Password">
    </div>

    <!-- cb_remember_me (CheckBox) -->
    <div class="checkbox-group">
      <input type="checkbox" id="cb_remember_me">
      <label for="cb_remember_me">Remember me</label>
    </div>

    <!-- btn_login (Button) — appearance="filled" -->
    <button class="btn btn-filled">Log In</button>

    <!-- nav_forgot_password (Link) -->
    <div class="forgot-password">
      <a href="#" class="link">Forgot password?</a>
    </div>

  </div>

  <!-- txt_signup_prompt (Text) + nav_sign_up (Link) -->
  <div class="signup-prompt">
    Don't have an account?
    <a href="#" class="link">Sign up</a>
  </div>

</div>

</body>
</html>
