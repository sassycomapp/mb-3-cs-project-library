<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mybizz CS — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #493ef3;
  --on-primary: #ffffff;
  --primary-container: #e6dff3;
  --on-primary-container: #0f0e59;
  --secondary: #625a74;
  --on-secondary-container: #1e182d;
  --surface: #fdfcff;
  --on-surface: #1c1b20;
  --surface-variant: #e5e0f0;
  --on-surface-variant: #494552;
  --surface-container-low: #f5f2fa;
  --outline: #7a7583;
  --outline-variant: #c9c4d3;
  --error: #b42336;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
  --font-family: 'Roboto', sans-serif;
  --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
  --divider-color: var(--outline-variant);
  --btn-filled-hover: color-mix(in srgb, var(--primary) 92%, transparent);
  --btn-shadow-hover: hsla(220, 30%, 5%, 0.15) 0px 1px 2px 0px, hsla(220, 25%, 10%, 0.15) 0px 1px 3px 1px;
}

body {
  font-family: var(--font-family);
  font-size: 14px;
  line-height: 1.4286;
  color: var(--on-surface);
  background-color: var(--surface);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}

.auth-container { width: 100%; max-width: 400px; }

.card-reset {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: 8px;
  padding: var(--space-6);
  box-shadow: var(--mui-shadow-card);
  width: 100%;
}

.hdg-reset-title {
  font-size: 32px; line-height: 40px; font-weight: 600;
  color: var(--on-surface); margin-bottom: var(--space-1); text-align: center;
}

.txt-reset-subtitle {
  font-size: 14px; line-height: 20px;
  color: var(--on-surface-variant); text-align: center; margin-bottom: var(--space-6);
}

.txt-reset-error {
  font-size: 14px; color: var(--error); background: #f4dddc;
  padding: var(--space-3) var(--space-4); border-radius: 4px;
  margin-bottom: var(--space-4); display: none;
}

.txt-reset-success {
  font-size: 14px; color: #2E7D32; background: #DEFCD3;
  padding: var(--space-3) var(--space-4); border-radius: 4px;
  margin-bottom: var(--space-4); display: none;
}

.form-group { margin-bottom: var(--space-4); }

.form-label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--on-surface); margin-bottom: var(--space-2);
}

.form-input {
  width: 100%; min-height: 48px; padding: var(--space-2) var(--space-4);
  font-size: 16px; font-family: var(--font-family);
  border: 1px solid var(--outline); border-radius: 4px;
  background: transparent; color: var(--on-surface);
}

.form-input:focus {
  border-color: var(--primary); border-width: 2px; padding: 7px 15px; outline: none;
}

.form-input::placeholder { color: var(--on-surface-variant); opacity: 0.7; }

.btn {
  font-family: var(--font-family); font-size: 14px; font-weight: 500;
  padding: 10px 24px; min-height: 40px; border-radius: 100px; border: none;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: background 150ms, box-shadow 150ms; width: 100%;
}

.btn-filled { background: var(--primary); color: var(--on-primary); }

.btn-filled:hover {
  background: var(--btn-filled-hover);
  box-shadow: var(--btn-shadow-hover);
}

.link {
  font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 500;
  display: block; text-align: center; margin-top: var(--space-3);
}

.link:hover { opacity: 0.8; text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1c1b20;
    --on-surface: #e6e1e5;
    --surface-variant: #49454f;
    --on-surface-variant: #cac4d0;
    --outline: #938f99;
    --outline-variant: #49454f;
    --surface-container-low: #2b2930;
  }
}
</style>
</head>
<body>

<div class="auth-container">
  <div class="card-reset">
    <h1 class="hdg-reset-title">Reset your password</h1>
    <p class="txt-reset-subtitle">Enter your email address and we'll send you a link to reset your password</p>

    <div class="txt-reset-error">Email not found. Please check and try again.</div>
    <div class="txt-reset-success">Reset link sent. Check your inbox.</div>

    <div class="form-group">
      <label class="form-label" for="txt_email">Email address</label>
      <input type="email" id="txt_email" class="form-input" placeholder="Email address">
    </div>

    <button class="btn btn-filled">Send Reset Link</button>

    <a href="#" class="link">Back to log in</a>
  </div>
</div>

</body>
</html>
