<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — CustomerLayout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --surface-container-low: #F7F2FA;
      --outline: #79747E;
      --outline-variant: #CAC4D0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --font-family: 'Roboto', sans-serif;
      --font-title: 18px/24px 500;
      --font-body: 14px/20px 400;
      --font-label: 12px/16px 500;
      --radius-card: 12px;
      --radius-input: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      min-height: 56px;
    }

    .app-bar-title {
      font: var(--font-title);
      color: var(--on-surface);
    }

    .app-bar-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      color: var(--on-surface-variant);
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--surface-variant);
    }

    .icon-btn:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .layout-body {
      display: flex;
      flex: 1;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--surface-container-low);
      border-right: 1px solid var(--outline-variant);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      overflow-y: auto;
    }

    .nav-section-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: var(--space-4) var(--space-3) var(--space-1);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      font: var(--font-body);
      color: var(--on-surface-variant);
      text-decoration: none;
      border-radius: var(--radius-input);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
    }

    .nav-item:hover {
      background: var(--surface-variant);
    }

    .nav-item.active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      font-weight: 500;
    }

    .nav-item:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .nav-spacer {
      flex: 1;
    }

    .content-area {
      flex: 1;
      padding: var(--space-6);
      background: var(--surface);
      overflow-y: auto;
    }

    .content-placeholder {
      width: 100%;
      min-height: 400px;
      background: var(--surface-container-low);
      border: 1px dashed var(--outline-variant);
      border-radius: var(--radius-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--on-surface-variant);
      font: var(--font-body);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --surface-container-low: #1D1B20;
        --outline: #938F99;
        --outline-variant: #49454F;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-bar" role="banner">
    <span class="app-bar-title">My Customer Portal</span>
    <div class="app-bar-actions">
      <button class="icon-btn" aria-label="Notifications">&#128276;</button>
      <button class="icon-btn" aria-label="User menu">&#128100;</button>
    </div>
  </header>

  <div class="layout-body">
    <nav class="sidebar" role="navigation" aria-label="Customer navigation">
      <div class="nav-section-label">Portal</div>
      <a class="nav-item active" href="#">
        <span class="nav-icon">&#9632;</span>
        My Dashboard
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#128197;</span>
        My Bookings
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#128179;</span>
        My Invoices
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#11088;</span>
        My Reviews
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#128172;</span>
        Support Tickets
      </a>
      <div class="nav-spacer"></div>
      <div class="nav-section-label">Account</div>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#9881;</span>
        Account
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">&#128682;</span>
        Sign Out
      </a>
    </nav>

    <main class="content-area" role="main">
      <div class="content-placeholder">
        Customer portal content loads here
      </div>
    </main>
  </div>
</body>
</html>
