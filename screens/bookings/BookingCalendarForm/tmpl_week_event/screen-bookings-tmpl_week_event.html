<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — tmpl_week_event</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa; --surface-container: #efedf5;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --font-family: 'Roboto', sans-serif;
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --status-confirmed: #388e3c;
      --status-pending: #f9a825;
      --status-cancelled: #c62828;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); padding: var(--space-8); }
    .template-demo { max-width: 600px; margin: 0 auto; }
    .template-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .week-event { background: var(--surface-container-low); border-radius: 8px; padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); cursor: pointer; border-left: 4px solid var(--status-confirmed); }
    .week-event:hover { background: rgba(73,62,243, var(--state-hover-opacity)); }
    .week-event.pending { border-left-color: var(--status-pending); }
    .week-event.cancelled { border-left-color: var(--status-cancelled); opacity: 0.5; }
    .week-event-time { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); }
    .week-event-title { font-size: 14px; font-weight: 500; color: var(--on-surface); }
    .week-event-customer { font-size: 13px; color: var(--on-surface-variant); }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #cfbdf8; --on-primary: #381e72; --primary-container: #4f378b; --on-primary-container: #eaddff; --surface: #1c1b20; --on-surface: #e6e1e5; --surface-variant: #49454f; --on-surface-variant: #cac4d0; --surface-container-low: #1d1b20; --outline: #938f99; --outline-variant: #49454f; }
    }
  </style>
</head>
<body>
  <div class="template-demo">
    <div class="template-label">tmpl_week_event — Week View Event Blocks</div>
    <div class="week-event">
      <div class="week-event-time">09:00 – 10:00</div>
      <div class="week-event-title">Deep Tissue Massage</div>
      <div class="week-event-customer">Nomsa Dlamini</div>
    </div>
    <div class="week-event pending">
      <div class="week-event-time">11:00 – 12:00</div>
      <div class="week-event-title">Swedish Massage</div>
      <div class="week-event-customer">James van der Merwe</div>
    </div>
    <div class="week-event cancelled">
      <div class="week-event-time">14:00 – 15:00</div>
      <div class="week-event-title">Hot Stone Therapy</div>
      <div class="week-event-customer">Thabo Molefe</div>
    </div>
    <div class="week-event">
      <div class="week-event-time">16:00 – 17:00</div>
      <div class="week-event-title">Business Consultation</div>
      <div class="week-event-customer">Lerato Khumalo</div>
    </div>
  </div>
</body>
</html>
