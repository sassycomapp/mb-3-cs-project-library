<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — tmpl_week_timeslot</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa; --surface-container: #efedf5;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --font-family: 'Roboto', sans-serif;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --status-confirmed: #388e3c;
      --status-pending: #f9a825;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); padding: var(--space-8); }
    .template-demo { max-width: 700px; margin: 0 auto; }
    .template-label { font-size: 11px; font-weight: 500; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-4); }
    .timeslot-row { display: flex; border-bottom: 1px solid var(--divider-color); min-height: 60px; }
    .timeslot-row:hover { background: rgba(73,62,243, var(--state-hover-opacity)); }
    .timeslot-label { width: 60px; flex-shrink: 0; padding: var(--space-2) var(--space-3); font-size: 12px; font-weight: 500; color: var(--on-surface-variant); border-right: 1px solid var(--divider-color); }
    .timeslot-content { flex: 1; padding: var(--space-2); position: relative; }
    .timeslot-spacer { height: 1px; background: var(--divider-color); opacity: 0.5; }
    .timeslot-event { background: var(--surface-container-low); border-radius: 6px; padding: var(--space-2) var(--space-3); margin-bottom: var(--space-1); border-left: 3px solid var(--status-confirmed); cursor: pointer; }
    .timeslot-event.pending { border-left-color: var(--status-pending); }
    .timeslot-event-time { font-size: 11px; color: var(--on-surface-variant); }
    .timeslot-event-title { font-size: 13px; font-weight: 500; color: var(--on-surface); }
    .timeslot-event-customer { font-size: 12px; color: var(--on-surface-variant); }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #cfbdf8; --on-primary: #381e72; --primary-container: #4f378b; --on-primary-container: #eaddff; --surface: #1c1b20; --on-surface: #e6e1e5; --surface-variant: #49454f; --on-surface-variant: #cac4d0; --surface-container-low: #1d1b20; --outline: #938f99; --outline-variant: #49454f; }
    }
  </style>
</head>
<body>
  <div class="template-demo">
    <div class="template-label">tmpl_week_timeslot — Week View Time Rows</div>

    <div class="timeslot-row">
      <div class="timeslot-label">09:00</div>
      <div class="timeslot-content">
        <div class="timeslot-event">
          <div class="timeslot-event-time">09:00 – 10:00</div>
          <div class="timeslot-event-title">Deep Tissue Massage</div>
          <div class="timeslot-event-customer">Nomsa Dlamini</div>
        </div>
      </div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">10:00</div>
      <div class="timeslot-content"><div class="timeslot-spacer"></div></div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">11:00</div>
      <div class="timeslot-content">
        <div class="timeslot-event pending">
          <div class="timeslot-event-time">11:00 – 12:00</div>
          <div class="timeslot-event-title">Swedish Massage</div>
          <div class="timeslot-event-customer">James van der Merwe</div>
        </div>
      </div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">12:00</div>
      <div class="timeslot-content"><div class="timeslot-spacer"></div></div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">13:00</div>
      <div class="timeslot-content"><div class="timeslot-spacer"></div></div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">14:00</div>
      <div class="timeslot-content"><div class="timeslot-spacer"></div></div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">15:00</div>
      <div class="timeslot-content"><div class="timeslot-spacer"></div></div>
    </div>

    <div class="timeslot-row">
      <div class="timeslot-label">16:00</div>
      <div class="timeslot-content">
        <div class="timeslot-event">
          <div class="timeslot-event-time">16:00 – 17:00</div>
          <div class="timeslot-event-title">Business Consultation</div>
          <div class="timeslot-event-customer">Lerato Khumalo</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
