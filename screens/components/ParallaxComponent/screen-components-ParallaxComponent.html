<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — ParallaxComponent</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #493ef3; --on-primary: #ffffff;
      --primary-container: #e6dff3; --on-primary-container: #0f0e59;
      --secondary: #625a74; --on-secondary: #ffffff;
      --secondary-container: #e8defc; --on-secondary-container: #1e182d;
      --surface: #fdfcff; --on-surface: #1c1b20;
      --surface-variant: #e5e0f0; --on-surface-variant: #494552;
      --surface-container-low: #f5f2fa; --surface-container: #efedf5;
      --outline: #7a7583; --outline-variant: #c9c4d3;
      --error: #b42336; --on-error: #ffffff;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-6: 24px; --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --mui-shadow-card: hsla(220,30%,5%,0.07) 0px 4px 16px 0px, hsla(220,25%,10%,0.07) 0px 8px 16px -5px;
      --divider-color: var(--outline-variant);
      --state-hover-opacity: 0.08;
      --state-pressed-opacity: 0.12;
    }
    body { font-family: var(--font-family); font-size: 14px; line-height: 1.4286; color: var(--on-surface); background-color: var(--surface); }

    /* Parallax hero section */
    .parallax-hero { position: relative; height: 500px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .parallax-bg { position: absolute; top: 0; left: 0; width: 100%; height: 120%; background: linear-gradient(135deg, var(--primary-container) 0%, var(--surface-container-low) 50%, var(--secondary-container) 100%); z-index: 0; }
    .parallax-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 1; }
    .parallax-content { position: relative; z-index: 2; text-align: center; max-width: 600px; padding: var(--space-6); }
    .parallax-headline { font-size: 48px; line-height: 56px; font-weight: 700; color: #ffffff; margin-bottom: var(--space-4); text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .parallax-body { font-size: 18px; line-height: 28px; color: rgba(255,255,255,0.9); margin-bottom: var(--space-6); }
    .btn { font-family: var(--font-family); font-size: 14px; font-weight: 500; padding: 12px 32px; min-height: 48px; border-radius: 100px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background 150ms, box-shadow 150ms; }
    .btn-filled { background: var(--primary); color: var(--on-primary); }
    .btn-filled:hover { background: rgba(73,62,243,0.92); box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15); }

    /* Placeholder content below */
    .placeholder-content { padding: var(--space-8) var(--space-6); max-width: 900px; margin: 0 auto; text-align: center; }
    .placeholder-content p { color: var(--on-surface-variant); font-size: 14px; }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #cfbdf8; --on-primary: #381e72;
        --primary-container: #4f378b; --on-primary-container: #eaddff;
        --secondary: #ccc2dc; --on-secondary: #332d41;
        --secondary-container: #4a4458; --on-secondary-container: #e8def8;
        --surface: #1c1b20; --on-surface: #e6e1e5;
        --surface-variant: #49454f; --on-surface-variant: #cac4d0;
        --surface-container-low: #1d1b20; --surface-container: #211f26;
        --outline: #938f99; --outline-variant: #49454f;
        --error: #f2b8b5; --on-error: #601410;
      }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <!-- PARALLAX COMPONENT -->
  <section class="parallax-hero">
    <div class="parallax-bg"></div>
    <div class="parallax-overlay"></div>
    <div class="parallax-content">
      <h1 class="parallax-headline">Your Wellness Journey Starts Here</h1>
      <p class="parallax-body">Experience premium massage therapy, beauty treatments, and holistic wellness services at Serenity Spa in Sandton.</p>
      <button class="btn btn-filled">Book Your Session</button>
    </div>
  </section>

  <!-- Placeholder content below to demonstrate scroll effect -->
  <div class="placeholder-content">
    <p>[Page content continues below — the parallax background scrolls at a slower rate than the foreground content, creating depth]</p>
  </div>

</body>
</html>
