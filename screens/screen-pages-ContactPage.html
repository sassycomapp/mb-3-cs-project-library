<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — ContactPage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-display: 57px/64px 400;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-body: 14px/20px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
      --elevation-card: 2dp;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-content {
      flex: 1;
      padding: 60px var(--space-8);
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }

    .page-content h1 {
      font: var(--font-headline-large);
      margin-bottom: var(--space-8);
      text-align: center;
    }

    .contact-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--space-8);
      box-shadow: 0 var(--elevation-card);
    }

    .form-group {
      margin-bottom: var(--space-4);
    }

    .form-label {
      display: block;
      font: var(--font-label);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-2);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-input);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
      font-family: var(--font-family);
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-container);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--outline);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      font: var(--font-button);
      color: var(--on-primary);
      background: var(--primary);
      border: none;
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
      width: 100%;
      margin-top: var(--space-4);
    }

    .btn-primary:hover {
      background: #523E8A;
    }

    .btn-primary:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .footer {
      background: var(--on-surface);
      color: var(--surface-variant);
      padding: 48px var(--space-8) var(--space-6);
    }

    .footer-top {
      display: flex;
      gap: var(--space-8);
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 32px;
    }

    .footer-col {
      flex: 1;
      min-width: 200px;
    }

    .footer-col h4 {
      font: var(--font-title);
      color: var(--surface);
      margin-bottom: var(--space-4);
    }

    .footer-logo {
      font: var(--font-headline-small);
      color: var(--surface);
      margin-bottom: var(--space-2);
    }

    .footer-tagline {
      font: var(--font-caption);
      color: var(--outline);
    }

    .footer-links {
      list-style: none;
      padding: 0;
    }

    .footer-links li {
      margin-bottom: var(--space-2);
    }

    .footer-links a {
      color: var(--surface-variant);
      text-decoration: none;
      font: var(--font-body);
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-links a:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .social-links {
      display: flex;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--surface-variant);
      text-decoration: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .social-icon:hover {
      border-color: var(--primary-container);
    }

    .social-icon:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .footer-contact p {
      font: var(--font-body);
      color: var(--surface-variant);
      margin-bottom: var(--space-2);
    }

    .footer-map {
      width: 100%;
      height: 120px;
      background: var(--surface-variant);
      border-radius: var(--radius-input);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--outline);
      font: var(--font-caption);
      margin-top: var(--space-4);
    }

    .footer-bottom {
      border-top: 1px solid var(--on-surface-variant);
      padding-top: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .footer-bottom p {
      font: var(--font-caption);
      color: var(--outline);
    }

    .footer-bottom a {
      color: var(--outline);
      text-decoration: none;
      font: var(--font-caption);
    }

    .footer-bottom a:hover {
      text-decoration: underline;
    }

    .footer-bottom a:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-content" role="main">
    <h1>Get in Touch</h1>
    <article class="contact-card">
      <form id="contactForm" action="/contact" method="POST">
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-input"
            placeholder="Enter your phone number"
            autocomplete="tel"
          >
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea
            id="message"
            name="message"
            class="form-textarea"
            placeholder="How can we help you?"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary">
          Send Message
        </button>
      </form>
    </article>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer-top">
      <div class="footer-col">
        <p class="footer-logo">Mybizz</p>
        <p class="footer-tagline">Professional consulting and services</p>
      </div>
      <div class="footer-col">
        <h4>Quick Links</h4>
        <ul class="footer-links">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/terms">Terms & Conditions</a></li>
          <li><a href="/cookies">Cookie Policy</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>Connect</h4>
        <div class="social-links">
          <a href="#" class="social-icon" aria-label="Facebook">FB</a>
          <a href="#" class="social-icon" aria-label="Instagram">IG</a>
          <a href="#" class="social-icon" aria-label="LinkedIn">LI</a>
          <a href="#" class="social-icon" aria-label="Twitter">TW</a>
        </div>
      </div>
      <div class="footer-col footer-contact">
        <h4>Contact Us</h4>
        <p>email@example.com</p>
        <p>+1 234 567 890</p>
        <div class="footer-map" aria-label="Map placeholder">Google Maps Embed</div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Mybizz. All rights reserved.</p>
      <a href="#top">Back to Top</a>
    </div>
  </footer>
</body>
</html>
