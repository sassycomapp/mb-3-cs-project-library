<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Week Event Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --surface-container: #F3EDF7;
      --surface-container-high: #ECE6F0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-title-medium: 16px/24px 500;
      --font-body: 14px/20px 400;
      --font-body-small: 12px/16px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      padding: var(--space-8);
      display: flex;
      justify-content: center;
    }

    .page-container {
      width: 100%;
      max-width: 500px;
    }

    .page-header {
      margin-bottom: var(--space-6);
    }

    .page-header h1 {
      font: var(--font-headline-small);
      color: var(--on-surface);
      margin-bottom: var(--space-2);
    }

    .page-header p {
      font: var(--font-body);
      color: var(--on-surface-variant);
    }

    .template-preview {
      background: var(--surface-container);
      border-radius: var(--radius-card);
      padding: var(--space-6);
    }

    .template-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .week-column {
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--surface-variant);
      overflow: hidden;
      width: 160px;
    }

    .week-column-header {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-align: center;
      padding: var(--space-2);
      background: var(--surface-container);
      border-bottom: 1px solid var(--surface-variant);
    }

    .week-column-header.today {
      color: var(--primary);
      font-weight: 700;
    }

    .week-event {
      padding: var(--space-1) var(--space-2);
      border-bottom: 1px solid var(--surface-variant);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 48px;
      position: relative;
    }

    .week-event:hover {
      background: var(--surface-container);
    }

    .week-event:last-child {
      border-bottom: none;
    }

    .week-event .event-title {
      font: var(--font-body-small);
      color: var(--on-surface);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .week-event .event-time {
      font: 10px/14px 400;
      color: var(--on-surface-variant);
    }

    .week-event.confirmed {
      border-left: 3px solid #388e3c;
    }

    .week-event.pending {
      border-left: 3px solid #f9a825;
    }

    .week-event.cancelled {
      border-left: 3px solid #c62828;
      opacity: 0.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
        --surface-container: #211F26;
        --surface-container-high: #2B2930;
      }
      .week-event.confirmed { border-left-color: #95d5b2; }
      .week-event.pending { border-left-color: #ffd166; }
      .week-event.cancelled { border-left-color: #f4a3a8; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page-container" role="main">
    <header class="page-header">
      <h1>tmpl_week_event</h1>
      <p>Renders an event block inside a week view day column.</p>
    </header>

    <div class="template-preview">
      <div class="template-label">Component Preview</div>

      <div class="week-column">
        <div class="week-column-header today">Wed 3</div>
        <div class="week-event confirmed" role="button" tabindex="0">
          <div class="event-title">Initial Consultation</div>
          <div class="event-time">10:00 — 11:00</div>
        </div>
        <div class="week-event pending" role="button" tabindex="0">
          <div class="event-title">Tax Review</div>
          <div class="event-time">14:00 — 15:30</div>
        </div>
        <div class="week-event confirmed" role="button" tabindex="0">
          <div class="event-title">Financial Planning</div>
          <div class="event-time">16:00 — 17:00</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
