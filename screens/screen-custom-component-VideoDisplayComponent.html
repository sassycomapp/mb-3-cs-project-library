<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Video Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --surface-container: #F3EDF7;
      --surface-container-low: #F7F2FA;
      --outline: #79747E;
      --outline-variant: #CAC4D0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-body: 14px/20px 400;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --font-title: 18px/24px 500;
      --radius-card: 12px;
      --radius-input: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      gap: var(--space-8);
    }

    .demo-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-align: center;
    }

    /* VideoDisplayComponent — display-only */
    .video-display {
      width: 100%;
      max-width: 720px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    .play-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .play-button:hover {
      transform: scale(1.1);
      background: #fff;
    }

    .play-button svg {
      width: 32px;
      height: 32px;
      margin-left: 4px;
      fill: #333;
    }

    .video-source-label {
      position: absolute;
      bottom: var(--space-3);
      left: var(--space-3);
      font: var(--font-caption);
      color: rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-input);
    }

    .video-caption {
      font: var(--font-caption);
      color: var(--on-surface-variant);
      margin-top: var(--space-2);
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --surface-container: #211F26;
        --surface-container-low: #1D1B20;
        --outline: #938F99;
        --outline-variant: #49454F;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    @media (max-width: 480px) {
      .play-button {
        width: 56px;
        height: 56px;
      }
      .play-button svg {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <p class="demo-label">VideoDisplayComponent — Display-only (valid video URL)</p>

  <main class="video-display" role="main">
    <div class="video-wrapper" role="region" aria-label="Video player">
      <div class="video-placeholder">
        <div class="play-button" role="button" aria-label="Play video" tabindex="0">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>
      <span class="video-source-label">YouTube</span>
    </div>
    <p class="video-caption">Video — How to Optimize Your Business Operations</p>
  </main>
</body>
</html>
