<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Week Timeslot Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --surface-container: #F3EDF7;
      --surface-container-high: #ECE6F0;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-title-medium: 16px/24px 500;
      --font-body: 14px/20px 400;
      --font-body-small: 12px/16px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      padding: var(--space-8);
      display: flex;
      justify-content: center;
    }

    .page-container {
      width: 100%;
      max-width: 500px;
    }

    .page-header {
      margin-bottom: var(--space-6);
    }

    .page-header h1 {
      font: var(--font-headline-small);
      color: var(--on-surface);
      margin-bottom: var(--space-2);
    }

    .page-header p {
      font: var(--font-body);
      color: var(--on-surface-variant);
    }

    .template-preview {
      background: var(--surface-container);
      border-radius: var(--radius-card);
      padding: var(--space-6);
    }

    .template-label {
      font: var(--font-label);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeslot-row {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: var(--space-2);
      border-bottom: 1px solid var(--surface-variant);
      padding: var(--space-2) 0;
    }

    .timeslot-row:last-child {
      border-bottom: none;
    }

    .timeslot-label {
      font: var(--font-caption);
      color: var(--on-surface-variant);
      text-align: right;
      padding-top: var(--space-1);
    }

    .timeslot-content {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .timeslot-event {
      background: var(--surface);
      border-radius: 6px;
      border-left: 3px solid var(--primary);
      padding: var(--space-1) var(--space-2);
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .timeslot-event:hover {
      background: var(--primary-container);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .timeslot-event.confirmed {
      border-left-color: #388e3c;
    }

    .timeslot-event.pending {
      border-left-color: #f9a825;
    }

    .timeslot-event .event-title {
      font: var(--font-body-small);
      color: var(--on-surface);
      font-weight: 500;
    }

    .timeslot-event .event-subtitle {
      font: 10px/14px 400;
      color: var(--on-surface-variant);
    }

    .timeslot-spacer {
      height: 1px;
      background: var(--surface-variant);
      opacity: 0.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
        --surface-container: #211F26;
        --surface-container-high: #2B2930;
      }
      .timeslot-event.confirmed { border-left-color: #95d5b2; }
      .timeslot-event.pending { border-left-color: #ffd166; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page-container" role="main">
    <header class="page-header">
      <h1>tmpl_week_timeslot</h1>
      <p>Renders a time row within the week view, containing zero or more events.</p>
    </header>

    <div class="template-preview">
      <div class="template-label">Component Preview</div>

      <div class="timeslot-row">
        <div class="timeslot-label">9:00</div>
        <div class="timeslot-content">
          <div class="timeslot-spacer"></div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">10:00</div>
        <div class="timeslot-content">
          <div class="timeslot-event confirmed" role="button" tabindex="0">
            <div class="event-title">Initial Consultation</div>
            <div class="event-subtitle">John Doe — 60 min</div>
          </div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">11:00</div>
        <div class="timeslot-content">
          <div class="timeslot-spacer"></div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">12:00</div>
        <div class="timeslot-content">
          <div class="timeslot-spacer"></div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">13:00</div>
        <div class="timeslot-content">
          <div class="timeslot-spacer"></div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">14:00</div>
        <div class="timeslot-content">
          <div class="timeslot-event pending" role="button" tabindex="0">
            <div class="event-title">Tax Review</div>
            <div class="event-subtitle">Jane Smith — 90 min</div>
          </div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">15:00</div>
        <div class="timeslot-content">
          <div class="timeslot-spacer"></div>
        </div>
      </div>

      <div class="timeslot-row">
        <div class="timeslot-label">16:00</div>
        <div class="timeslot-content">
          <div class="timeslot-event confirmed" role="button" tabindex="0">
            <div class="event-title">Financial Planning</div>
            <div class="event-subtitle">Thabo Molefe — 60 min</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
