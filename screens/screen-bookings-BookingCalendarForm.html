<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Booking Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      --surface-container: #F3EDF7;
      --surface-container-high: #ECE6F0;
      --tertiary: #7D5260;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --font-family: 'Roboto', sans-serif;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-title-medium: 16px/24px 500;
      --font-body: 14px/20px 400;
      --font-body-small: 12px/16px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 20px;
      min-height: 100vh;
      padding: var(--space-8);
      display: flex;
      justify-content: center;
    }

    .page-container {
      width: 100%;
      max-width: 1100px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
      gap: var(--space-3);
    }

    .page-header h1 {
      font: var(--font-headline-large);
      color: var(--on-surface);
    }

    .view-controls {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--outline);
      border-radius: var(--radius-button);
      overflow: hidden;
    }

    .view-toggle button {
      padding: var(--space-2) var(--space-4);
      font: var(--font-button);
      color: var(--on-surface);
      background: transparent;
      border: none;
      border-right: 1px solid var(--outline);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      min-height: 36px;
    }

    .view-toggle button:last-child {
      border-right: none;
    }

    .view-toggle button.active {
      background: var(--primary);
      color: var(--on-primary);
    }

    .view-toggle button:not(.active):hover {
      background: var(--surface-variant);
    }

    .view-toggle button:focus {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-left: auto;
    }

    .month-nav-label {
      font: var(--font-title);
      color: var(--on-surface);
      min-width: 180px;
      text-align: center;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--outline);
      background: transparent;
      color: var(--on-surface);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }

    .btn-icon:hover { background: var(--surface-variant); }
    .btn-icon:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      font: var(--font-button);
      color: var(--primary);
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
      white-space: nowrap;
    }

    .btn-secondary:hover { background: var(--primary-container); }
    .btn-secondary:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

    .calendar-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--surface-variant);
      overflow: hidden;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .calendar-day-header {
      font: var(--font-label);
      color: var(--on-surface-variant);
      text-align: center;
      padding: var(--space-3) var(--space-2);
      background: var(--surface-container);
      border-bottom: 1px solid var(--surface-variant);
    }

    .calendar-day {
      min-height: 90px;
      padding: var(--space-2);
      border-right: 1px solid var(--surface-variant);
      border-bottom: 1px solid var(--surface-variant);
      position: relative;
    }

    .calendar-day:nth-child(7n) {
      border-right: none;
    }

    .calendar-day .day-number {
      font: var(--font-body-small);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-1);
    }

    .calendar-day.other-month .day-number {
      color: var(--outline);
    }

    .calendar-day.today {
      background: var(--primary-container);
    }

    .calendar-day.today .day-number {
      color: var(--on-primary-container);
      font-weight: 700;
    }

    .event-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin: 1px;
    }

    .event-dot.confirmed { background: #388e3c; }
    .event-dot.pending { background: #f9a825; }
    .event-dot.cancelled { background: #c62828; }

    .event-chip {
      display: block;
      font: 10px/14px 500;
      padding: 1px 4px;
      border-radius: 3px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .event-chip.confirmed {
      background: #c8e6c9;
      color: #1b5e20;
    }

    .event-chip.pending {
      background: #fff9c4;
      color: #795548;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
        --surface-container: #211F26;
        --surface-container-high: #2B2930;
      }
      .event-chip.confirmed { background: #1b4332; color: #95d5b2; }
      .event-chip.pending { background: #3a2e00; color: #ffd166; }
      .event-dot.confirmed { background: #95d5b2; }
      .event-dot.pending { background: #ffd166; }
      .event-dot.cancelled { background: #f4a3a8; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page-container" role="main">
    <header class="page-header">
      <h1>Calendar</h1>
      <button type="button" class="btn-secondary">List View</button>
    </header>

    <div class="view-controls">
      <div class="view-toggle" role="tablist" aria-label="Calendar view">
        <button role="tab" aria-selected="false">Month</button>
        <button role="tab" aria-selected="true" class="active">Week</button>
        <button role="tab" aria-selected="false">Day</button>
      </div>
      <div class="month-nav">
        <button class="btn-icon" aria-label="Previous period">&larr;</button>
        <span class="month-nav-label">June 2026</span>
        <button class="btn-icon" aria-label="Next period">&rarr;</button>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-grid" role="grid" aria-label="June 2026 calendar">
        <div class="calendar-day-header" role="columnheader">Sun</div>
        <div class="calendar-day-header" role="columnheader">Mon</div>
        <div class="calendar-day-header" role="columnheader">Tue</div>
        <div class="calendar-day-header" role="columnheader">Wed</div>
        <div class="calendar-day-header" role="columnheader">Thu</div>
        <div class="calendar-day-header" role="columnheader">Fri</div>
        <div class="calendar-day-header" role="columnheader">Sat</div>

        <div class="calendar-day other-month"><div class="day-number">31</div></div>
        <div class="calendar-day"><div class="day-number">1</div></div>
        <div class="calendar-day"><div class="day-number">2</div></div>
        <div class="calendar-day today"><div class="day-number">3</div><span class="event-chip confirmed">10:00 Consult</span><span class="event-chip pending">14:00 Tax Rev</span></div>
        <div class="calendar-day"><div class="day-number">4</div></div>
        <div class="calendar-day"><div class="day-number">5</div><span class="event-chip confirmed">09:00 Audit</span></div>
        <div class="calendar-day"><div class="day-number">6</div></div>

        <div class="calendar-day"><div class="day-number">7</div></div>
        <div class="calendar-day"><div class="day-number">8</div><span class="event-chip confirmed">11:00 Planning</span></div>
        <div class="calendar-day"><div class="day-number">9</div></div>
        <div class="calendar-day"><div class="day-number">10</div></div>
        <div class="calendar-day"><div class="day-number">11</div><span class="event-chip pending">15:30 Bookkeep</span></div>
        <div class="calendar-day"><div class="day-number">12</div></div>
        <div class="calendar-day"><div class="day-number">13</div></div>

        <div class="calendar-day"><div class="day-number">14</div></div>
        <div class="calendar-day"><div class="day-number">15</div><span class="event-chip confirmed">10:00 Consult</span></div>
        <div class="calendar-day"><div class="day-number">16</div><span class="event-chip pending">14:00 Tax Rev</span></div>
        <div class="calendar-day"><div class="day-number">17</div></div>
        <div class="calendar-day"><div class="day-number">18</div><span class="event-chip confirmed">09:00 Finance</span></div>
        <div class="calendar-day"><div class="day-number">19</div></div>
        <div class="calendar-day"><div class="day-number">20</div></div>

        <div class="calendar-day"><div class="day-number">21</div></div>
        <div class="calendar-day"><div class="day-number">22</div><span class="event-chip confirmed">15:30 Audit</span></div>
        <div class="calendar-day"><div class="day-number">23</div></div>
        <div class="calendar-day"><div class="day-number">24</div></div>
        <div class="calendar-day"><div class="day-number">25</div></div>
        <div class="calendar-day"><div class="day-number">26</div></div>
        <div class="calendar-day"><div class="day-number">27</div></div>

        <div class="calendar-day"><div class="day-number">28</div></div>
        <div class="calendar-day"><div class="day-number">29</div></div>
        <div class="calendar-day"><div class="day-number">30</div></div>
        <div class="calendar-day other-month"><div class="day-number">1</div></div>
        <div class="calendar-day other-month"><div class="day-number">2</div></div>
        <div class="calendar-day other-month"><div class="day-number">3</div></div>
        <div class="calendar-day other-month"><div class="day-number">4</div></div>
      </div>
    </div>
  </main>
</body>
</html>
