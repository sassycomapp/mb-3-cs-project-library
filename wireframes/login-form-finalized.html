<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybizz CS — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* M3 Color System */
      --primary: #6750A4;
      --on-primary: #FFFFFF;
      --primary-container: #EADDFF;
      --on-primary-container: #21005D;
      --secondary: #625B71;
      --on-secondary: #FFFFFF;
      --secondary-container: #E8DEF8;
      --on-secondary-container: #1D192B;
      --surface: #FFFBFE;
      --on-surface: #1C1B1F;
      --surface-variant: #E7E0EC;
      --on-surface-variant: #49454F;
      --outline: #79747E;
      --error: #B3261E;
      --on-error: #FFFFFF;
      
      /* Spacing Scale */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      
      /* Typography */
      --font-family: 'Roboto', sans-serif;
      --font-display: 57px/64px 400;
      --font-headline-large: 32px/40px 400;
      --font-headline-small: 22px/28px 500;
      --font-title: 18px/24px 500;
      --font-body: 14px/20px 400;
      --font-button: 14px/14px 500;
      --font-label: 12px/16px 500;
      --font-caption: 12px/16px 400;
      
      /* Border Radius */
      --radius-button: 100px;
      --radius-card: 12px;
      --radius-input: 4px;
      
      /* Elevation */
      --elevation-card: 2dp;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-family);
      font-size: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: var(--space-8);
    }
    
    .login-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: var(--space-8);
      box-shadow: 0 var(--elevation-card);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }
    
    .login-header h1 {
      font: var(--font-headline-large);
      color: var(--on-surface);
      margin-bottom: var(--space-2);
    }
    
    .login-header p {
      font: var(--font-body);
      color: var(--on-surface-variant);
    }
    
    .form-group {
      margin-bottom: var(--space-4);
    }
    
    .form-label {
      display: block;
      font: var(--font-label);
      color: var(--on-surface-variant);
      margin-bottom: var(--space-2);
    }
    
    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-input);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-container);
    }
    
    .form-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 2px rgba(179, 38, 30, 0.2);
    }
    
    .form-input.error .form-label {
      color: var(--error);
    }
    
    .form-input.success {
      border-color: #4CAF50;
    }
    
    .form-input::placeholder {
      color: var(--outline);
    }
    
    .form-input[data-pretext] {
      min-height: 48px;
    }
    
    .form-error-message {
      display: none;
      font: var(--font-caption);
      color: var(--error);
      margin-top: var(--space-2);
      margin-left: var(--space-1);
      padding-left: var(--space-3);
      border-left: 2px solid var(--error);
    }
    
    .form-input.error + .form-error-message {
      display: block;
    }
    
    .form-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      margin-top: var(--space-6);
    }
    
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      font: var(--font-button);
      color: var(--on-primary);
      background: var(--primary);
      border: none;
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
    }
    
    .btn-primary:hover {
      background: #523E8A;
    }
    
    .btn-primary:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-6);
      font: var(--font-button);
      color: var(--primary);
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: background 0.2s;
      min-height: 40px;
    }
    
    .btn-secondary:hover {
      background: var(--primary-container);
    }
    
    .btn-secondary:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    
    .form-footer {
      text-align: center;
      margin-top: var(--space-6);
      font: var(--font-caption);
      color: var(--on-surface-variant);
    }
    
    .form-footer a {
      color: var(--primary);
      text-decoration: none;
    }
    
    .form-footer a:hover {
      text-decoration: underline;
    }
    
    .form-footer a:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 2px;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    
    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .remember-me label {
      font: var(--font-body);
      color: var(--on-surface-variant);
      cursor: pointer;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1C1B1F;
        --on-surface: #E6E1E5;
        --surface-variant: #49454F;
        --on-surface-variant: #CAC4D0;
        --outline: #938F99;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-container" role="main">
    <article class="login-card">
      <header class="login-header">
        <h1>Sign in</h1>
        <p>Sign in to your Mybizz account</p>
      </header>
      
      <form id="loginForm" action="/auth/login" method="POST">
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email"
            autocomplete="email"
            required
            data-pretext
          >
          <div class="form-error-message" id="email-error">Please enter a valid email address</div>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            data-pretext
          >
          <div class="form-error-message" id="password-error">Password must be at least 8 characters</div>
        </div>
        
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn-primary">
            Sign in
          </button>
          
          <a href="/auth/signup" class="btn-secondary">
            Create account
          </a>
        </div>
      </form>
      
      <footer class="form-footer">
        <a href="/auth/forgot-password">Forgot password?</a>
      </footer>
    </article>
  </main>
  
  <!-- Pretext Source (Inlined) -->
  <script>
    (function() {
      'use strict';
      
      const Pretext = {
        prepare: function(text, font) {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          ctx.font = font;
          
          const words = text.split(' ');
          const lines = [];
          let currentLine = '';
          
          for (const word of words) {
            const testLine = currentLine ? currentLine + ' ' + word : word;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > 300) {
              lines.push(currentLine);
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          }
          
          if (currentLine) {
            lines.push(currentLine);
          }
          
          const height = lines.length * 20;
          
          return {
            lines,
            height,
            handle: { text, font, lines }
          };
        },
        
        layout: function(handle, maxWidth, lineHeight) {
          const { text, font, lines } = handle;
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          ctx.font = font;
          
          const words = text.split(' ');
          const computedLines = [];
          let currentLine = '';
          
          for (const word of words) {
            const testLine = currentLine ? currentLine + ' ' + word : word;
            const metrics = ctx.measureText(testLine);
            
            if (metrics.width > maxWidth) {
              computedLines.push(currentLine);
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          }
          
          if (currentLine) {
            computedLines.push(currentLine);
          }
          
          const height = computedLines.length * lineHeight;
          
          return {
            height,
            lineCount: computedLines.length
          };
        }
      };
      
      document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('[data-pretext]');
        const prepared = new Map();
        
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function() {
            for (const el of inputs) {
              const font = getComputedStyle(el).font;
              prepared.set(el, Pretext.prepare(el.value || el.placeholder, font));
            }
            
            function relayout() {
              for (const [el, handle] of prepared) {
                const lineHeight = parseFloat(getComputedStyle(el).lineHeight);
                const maxWidth = el.clientWidth;
                const { height } = Pretext.layout(handle, maxWidth, lineHeight);
                el.style.minHeight = height + 'px';
              }
            }
            
            new ResizeObserver(() => relayout()).observe(document.body);
            relayout();
            
            // Add form validation
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              
              let isValid = true;
              
              // Email validation
              const email = document.getElementById('email');
              const emailError = document.getElementById('email-error');
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
              
              if (!emailRegex.test(email.value)) {
                email.classList.add('error');
                isValid = false;
              } else {
                email.classList.remove('error');
              }
              
              // Password validation
              const password = document.getElementById('password');
              const passwordError = document.getElementById('password-error');
              
              if (password.value.length < 8) {
                password.classList.add('error');
                isValid = false;
              } else {
                password.classList.remove('error');
              }
              
              if (isValid) {
                // Submit form
                alert('Form submitted! (This is a demo)');
              }
            });
            
            // Real-time validation
            inputs.forEach(input => {
              input.addEventListener('blur', function() {
                const inputError = this.parentElement.querySelector('.form-error-message');
                if (inputError) {
                  if (this.classList.contains('error')) {
                    inputError.style.display = 'block';
                  } else {
                    inputError.style.display = 'none';
                  }
                }
              });
            });
          });
        }
      });
    })();
  </script>
  
  <!-- FALLBACK: vendor/pretext.js missing, using inline implementation -->
</body>
</html>
